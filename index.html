<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F5F6F2">
<title>まいにち暗記</title>
<style>
  :root {
    --bg: #F5F6F2; --ink: #1F2A2E; --muted: #6B767C; --line: #DDE2DC;
    --blue: #2B5FA3; --green: #2E7D5B; --red: #C4453A;
    --basic: #2B5FA3; --adv: #2E7D5B; --ai: #B8741A; --stat: #7A4FA0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 18px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 480px; margin: 0 auto; padding: 18px 20px 40px; }

  /* どれを勉強するか */
  .tracks { display: flex; gap: 7px; margin-bottom: 14px; }
  .tracks button {
    flex: 1; padding: 11px 0; font-size: 14px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 11px;
    background: #fff; color: var(--muted); font-family: inherit; line-height: 1.3;
  }
  .tracks button.on { color: #fff; }
  .tracks button.on.basic { background: var(--basic); border-color: var(--basic); }
  .tracks button.on.adv   { background: var(--adv);   border-color: var(--adv); }
  .tracks button.on.ai    { background: var(--ai);    border-color: var(--ai); }
  .tracks button.on.stat  { background: var(--stat);  border-color: var(--stat); }

  .tabs { display: flex; gap: 8px; margin-bottom: 9px; }
  .tabs:last-of-type { margin-bottom: 18px; }
  .tabs button {
    flex: 1; padding: 12px 0; font-size: 15px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--muted); font-family: inherit;
  }
  .tabs button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tabs button.dg { background: #3b2a5c; border-color: #3b2a5c; color: #ffd84d; font-weight: 700; }
  .tabs button.dg.on { background: #22163a; border-color: #ffd84d; }
  .dgbox { background: #1d1530; color: #f3eefc; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .dgfloor { font-size: 13px; color: #c9b8ff; display: flex; justify-content: space-between; }
  .dgenemy { text-align: center; font-size: 72px; line-height: 1.1; margin: 6px 0 2px; }
  .dgname { text-align: center; font-weight: 700; font-size: 17px; margin-bottom: 6px; }
  .bar { height: 12px; background: #3a2f52; border-radius: 6px; overflow: hidden; margin: 4px 0 8px; }
  .bar > div { height: 100%; transition: width .4s; }
  .bar.e > div { background: #e0544a; }
  .bar.p > div { background: #44c08a; }
  .dglabel { font-size: 12px; color: #c9b8ff; }
  .dgmsg { background: #2c2246; border-radius: 8px; padding: 8px 10px; font-size: 14px; min-height: 20px; margin-top: 6px; }
  .shake { animation: shake .45s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  .ouch { animation: ouch .5s; }
  @keyframes ouch { 0%,100%{background:#1d1530} 30%{background:#6b1f2a} }
  .dgpick button { margin-bottom: 8px; }
  .dgimg { height: 120px; max-width: 100%; object-fit: contain; image-rendering: pixelated; }
  .dgtop { display: flex; justify-content: flex-end; }
  .dgbgm { background: none; border: 1px solid #6f5aa8; color: #ffd84d; border-radius: 8px; font-size: 12px; padding: 3px 8px; }

  .greet { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 18px; text-align: center; line-height: 1.8; }

  .q { font-size: 26px; font-weight: 700; line-height: 1.4; margin: 0 0 22px; }
  .a { font-size: 22px; font-weight: 700; color: var(--green); margin: 0 0 12px; }
  .exp {
    font-size: 16px; color: #3E4A4F; white-space: pre-line;
    border-left: 4px solid var(--line); padding-left: 14px; margin-bottom: 8px;
  }

  textarea {
    width: 100%; min-height: 84px; padding: 14px;
    font-size: 18px; font-family: inherit; line-height: 1.5;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--ink); resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--blue); }

  button.act {
    display: block; width: 100%; padding: 18px;
    font-size: 19px; font-weight: 700; font-family: inherit;
    color: #fff; background: var(--blue);
    border: 0; border-radius: 14px; margin-top: 14px; cursor: pointer;
  }
  button.act:active { opacity: .85; }
  .two { display: flex; gap: 12px; }
  .ok { background: var(--green); }
  .ng { background: var(--red); }
  .sub { background: #fff; color: var(--blue); border: 2px solid var(--line); }

  .picker { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .picker button {
    width: 52px; padding: 12px 0; font-size: 18px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--blue); font-family: inherit;
  }
  .picker .cur {
    flex: 1; text-align: center; font-size: 18px; font-weight: 700;
    padding: 12px 0; border: 2px solid var(--line); border-radius: 12px; background: #fff;
  }

  .done { text-align: center; padding: 42px 0 22px; }
  .done .big { font-size: 27px; font-weight: 700; margin-bottom: 10px; }
  .done .small { color: var(--muted); }
  .blist button { display: block; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 8px;
    border: 1px solid #d6d6d6; border-radius: 10px; background: #fff; font-size: 15px; }
  .blist .sc { float: right; color: var(--muted); font-size: 13px; }
  .range { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 10px 0; }
  .range input { width: 64px; font-size: 17px; padding: 6px; text-align: center; }
  .warn { background: #fff4e5; border: 1px solid #f0c27a; border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 14px; line-height: 1.7; }

  .foot { margin-top: 36px; text-align: center; font-size: 14px; color: var(--muted); }
  .foot a { color: var(--muted); margin: 0 8px; white-space: nowrap; }
  .hide { display: none; }

  /* ===== 並べ替え・4択（Duolingo風） ===== */
  .q.long { font-size: 19px; line-height: 1.6; }
  .slot {
    display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
    min-height: 62px; padding: 8px 0; margin-bottom: 18px;
    border-bottom: 2px solid var(--line);
  }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 4px; }
  .tile {
    padding: 9px 14px; font-size: 18px; font-family: inherit; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px;
  }
  .tile.used { background: var(--line); color: transparent; border-color: var(--line); }
  .opt {
    display: block; width: 100%; text-align: left; padding: 15px 16px; margin-bottom: 10px;
    font-size: 17px; font-family: inherit; line-height: 1.4; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px;
  }
  .opt.right { border-color: var(--green); background: #E6F2EC; }
  .opt.wrong { border-color: var(--red); background: #F8E7E5; }
  .res { margin-top: 18px; padding: 14px 16px; border-radius: 12px; }
  .res.good { background: #E6F2EC; }
  .res.bad  { background: #F8E7E5; }
  .res .mark { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .cand { border: 2px dashed #9aa7b8; border-radius: 12px; padding: 14px; margin: 12px 0; font-size: 17px; line-height: 1.6; background: #fafbfd; }
  .cand.right { border: 2px solid var(--green); background: #E6F2EC; }
  .cand.wrong { border: 2px solid var(--red); background: #F8E7E5; }
  .tfq { font-size: 14px; color: var(--muted); margin-top: 14px; }
  .memo { width: 100%; min-height: 56px; font-size: 15px; padding: 8px; border-radius: 10px; border: 1px solid #ccc; margin-top: 12px; box-sizing: border-box; }
  .easy { background: #FFF8E1; border-left: 4px solid #F2B705; border-radius: 8px; padding: 12px 14px; margin-top: 10px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; background: #eef1f6; border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
  .res.good .mark { color: var(--green); }
  .res.bad  .mark { color: var(--red); }
  button.act:disabled { opacity: .4; }
</style>
</head>
<body>
<main>
  <div class="tracks">
    <button id="trBasic" class="basic" onclick="setTrack('basic')">英語<br>基礎</button>
    <button id="trAdv"   class="adv"   onclick="setTrack('adv')">英語<br>応用</button>
    <button id="trAi"    class="ai"    onclick="setTrack('ai')">AI<br>E資格</button>
    <button id="trStat"  class="stat"  onclick="setTrack('stat')">統計<br>2級</button>
  </div>
  <div class="tabs">
    <button id="tabNight" onclick="setMode('night')">夜：おぼえる</button>
    <button id="tabMorning" onclick="setMode('morning')">朝：テスト</button>
  </div>
  <div class="tabs">
    <button id="tabReview" onclick="setMode('review')">復習</button>
    <button id="tabPast" onclick="setMode('past')">過去問</button>
    <button id="tabTests" onclick="setMode('tests')">まとめテスト</button>
  </div>
  <div class="tabs">
    <button id="tabDungeon" class="dg" onclick="setMode('dungeon')">⚔ ダンジョンに挑む</button>
  </div>
  <div id="app"></div>
  <div class="foot">
    <a href="#" onclick="fixDay();return false;">進み具合を直す</a>
    <a href="#" onclick="backup();return false;">バックアップ</a>
    <a href="#" onclick="restore();return false;">復元</a>
  </div>
</main>

<script>
/* ==================================================
   cards.json … track（basic / adv / ai）ごとに day と枚数を持つ
   localStorage … 進みぐあい。トラックごとに完全に別管理
   ================================================== */
var KEY = "mainichi_anki_v2";
var TRACKS = ["basic", "adv", "ai", "stat"];
var TRACK_NAME = { basic: "英語（基礎）", adv: "英語（応用）", ai: "AI（E資格）", stat: "統計検定2級" };

var ALL = [];
var S = null;          // { track: "basic", basic:{...}, adv:{...}, ai:{...} }
var T = null;          // 今選んでいるトラックの状態（Sの中の一部を指す）
var MODE = "night";
var LIST = [], IDX = 0;
var MAXDAY = {}, PAST_DAY = 1;
var BLOCK = 4;          // 何日ごとにまとめテストを出すか
var JUST_LEARNED = [];

/* 午前4時を1日の区切りにする（深夜に開いてもズレない） */
function studyDate() {
  var d = new Date();
  if (d.getHours() < 4) d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function byId(id) {
  for (var i = 0; i < ALL.length; i++) if (ALL[i]._id === id) return ALL[i];
  return null;
}
function cardsOfDay(n) {
  return ALL.filter(function (c) { return c.track === S.track && c.day === n; });
}

/* ============ 並べ替え・4択（Duolingo風） ============
   type なし     … 今まで通り（書いて自己採点）
   type:"order"    … 日→英 並べ替え（answerを自動で単語に分ける）
   type:"order_ja" … 英→日 並べ替え（piecesで区切りを指定）
   type:"choice"   … 4択（choices と correct=正解の番号 0〜3）
   ========================================================= */
var QZ = null;
var PUNC = /[.,!?。、！？]/g;
function isQuiz(c) { return c.type === "order" || c.type === "order_ja" || c.type === "choice"; }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function cleanWord(w) { return String(w || "").replace(PUNC, "").trim(); }
function joinSep(c) { return (c.type === "order_ja") ? "" : " "; }
function rightPieces(c) {
  var p = (c.pieces && c.pieces.length) ? c.pieces : String(c.answer || "").split(/\s+/);
  return p.map(cleanWord).filter(function (w) { return w; });
}
function norm(c, s) {
  s = String(s || "").toLowerCase().replace(PUNC, "");
  return (c.type === "order_ja") ? s.replace(/\s+/g, "") : s.replace(/\s+/g, " ").trim();
}
/* 答えの文字（answerが無いカードでも表示できるように） */
function answerText(c) {
  if (c.answer) return c.answer;
  if (c.type === "choice" && c.choices) return c.choices[c.correct] || "";
  if (c.pieces) return c.pieces.join(joinSep(c));
  return "";
}

var EASY_N = 0;
function easyHtml(c) {
  /* やさしい解説（c.easy）があるときだけ、開くボタンを付ける */
  if (!c.easy) return "";
  var id = "easy" + (++EASY_N);
  return '<button class="act sub" style="margin-top:10px" onclick="openEasy(\'' + id + '\', this)">もっとかみ砕いて</button>' +
         '<div id="' + id + '" class="easy hide">' + esc(c.easy) + '</div>';
}
function openEasy(id, btn) {
  document.getElementById(id).className = "easy";
  btn.className = "act sub hide";
}
function quizHtml(c, ctx, tf) {
  QZ = { c: c, ctx: ctx, picked: [], done: false, chosen: -1, memo: "" };
  /* B：○×形式（tf に選択肢の番号が入っているとき）*/
  QZ.tf = (c.type === "choice" && typeof tf === "number") ? tf : -1;
  /* C：4択・5択はまず選択肢を隠して、自分で考えてから開く */
  QZ.hidden = (c.type === "choice" && QZ.tf < 0 && ctx !== "p");
  if (c.type === "choice") {
    QZ.opts = shuffle((c.choices || []).map(function (t, i) { return { t: t, i: i }; }));
  } else {
    QZ.tiles = shuffle(rightPieces(c).concat((c.dummy || []).map(cleanWord)
                 .filter(function (w) { return w; })));
  }
  return '<div class="q' + (c.type === "choice" ? ' long' : '') + '">' + esc(c.question) + '</div>' +
         '<div id="qzBody"></div><div id="qzRes"></div>';
}
function drawQuiz() {
  var c = QZ.c, h = "", k;
  if (c.type === "choice" && QZ.tf >= 0) {
    h += '<div class="tfq">この問題の答えとして、次の選択肢は正しい？</div>';
    var cc = "cand";
    if (QZ.done) cc += (QZ.ok ? " right" : " wrong");
    h += '<div class="' + cc + '">' + esc(c.choices[QZ.tf]) + '</div>';
    if (!QZ.done) {
      h += '<div class="two"><button class="act ok" onclick="pickTF(1)">○ 正しい</button>' +
           '<button class="act ng" onclick="pickTF(0)">× 正しくない</button></div>';
    }
  } else if (c.type === "choice" && QZ.hidden) {
    h += '<textarea id="qzMemo" class="memo" placeholder="自分の答えをメモ（書かなくてもOK）"></textarea>';
    h += '<button class="act" onclick="openChoices()">考えた → 選択肢を見る</button>';
    h += '<div class="hint">選択肢を見る前に、答えやその理由を頭の中で言ってみましょう</div>';
  } else if (c.type === "choice") {
    if (QZ.memo) h += '<div class="hint" style="text-align:left">自分のメモ：' + esc(QZ.memo) + '</div>';
    for (k = 0; k < QZ.opts.length; k++) {
      var cls = "opt";
      if (QZ.done) {
        if (QZ.opts[k].i === c.correct) cls += " right";
        else if (k === QZ.chosen) cls += " wrong";
      }
      h += '<button class="' + cls + '" onclick="pickOpt(' + k + ')">' + esc(QZ.opts[k].t) + '</button>';
    }
  } else {
    h += '<div class="slot">';
    for (k = 0; k < QZ.picked.length; k++) {
      h += '<button class="tile" onclick="unpick(' + k + ')">' + esc(QZ.tiles[QZ.picked[k]]) + '</button>';
    }
    h += '</div><div class="bank">';
    for (k = 0; k < QZ.tiles.length; k++) {
      var used = QZ.picked.indexOf(k) >= 0;
      h += '<button class="tile' + (used ? ' used' : '') + '" onclick="pickTile(' + k + ')">' +
           esc(QZ.tiles[k]) + '</button>';
    }
    h += '</div>';
    if (!QZ.done) {
      h += '<button class="act" onclick="checkOrder()"' + (QZ.picked.length ? '' : ' disabled') +
           '>こたえ合わせ</button>';
    }
  }
  document.getElementById("qzBody").innerHTML = h;
}
function pickTile(k) {
  if (QZ.done || QZ.picked.indexOf(k) >= 0) return;
  QZ.picked.push(k); drawQuiz();
}
function unpick(k) {
  if (QZ.done) return;
  QZ.picked.splice(k, 1); drawQuiz();
}
function checkOrder() {
  var c = QZ.c;
  var typed = QZ.picked.map(function (k) { return QZ.tiles[k]; }).join(joinSep(c));
  var ok = (norm(c, typed) === norm(c, rightPieces(c).join(joinSep(c))));
  var alts = c.alts || [];
  for (var i = 0; i < alts.length && !ok; i++) if (norm(c, typed) === norm(c, alts[i])) ok = true;
  showResult(ok ? 1 : 0, typed);
}
function openChoices() {
  var m = document.getElementById("qzMemo");
  QZ.memo = m ? m.value.trim() : "";
  QZ.hidden = false; drawQuiz();
}
function pickTF(v) {
  if (QZ.done) return;
  var truth = (QZ.tf === QZ.c.correct) ? 1 : 0;
  showResult(v === truth ? 1 : 0, (v ? "○" : "×") + "：" + QZ.c.choices[QZ.tf]);
}
function pickOpt(k) {
  if (QZ.done) return;
  QZ.chosen = k;
  showResult(QZ.opts[k].i === QZ.c.correct ? 1 : 0, QZ.opts[k].t);
}
function showResult(ok, typed) {
  var c = QZ.c;
  QZ.done = true; QZ.ok = ok; QZ.typed = typed;
  drawQuiz();
  var h = '<div class="res ' + (ok ? 'good' : 'bad') + '">';
  h += '<div class="mark">' + (ok ? '○ 正解！' : '× ざんねん') + '</div>';
  if (QZ.tf >= 0) {
    h += '<div style="font-size:14px;margin:0 0 4px">この選択肢は' + (QZ.tf === c.correct ? '<b>正しい</b>' : '<b>正しくない</b>') + '。正解は：</div>';
    h += '<div class="a" style="margin:0 0 6px">' + esc(answerText(c)) + '</div>';
  } else if (!ok || c.type !== "choice") h += '<div class="a" style="margin:0 0 6px">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp" style="margin:0">' + esc(c.explanation) + '</div>';
  h += easyHtml(c);
  h += '</div>';
  if (QZ.ctx !== "p") {
    if (ok) {
      h += '<div class="two"><button class="act ok" onclick="finishQuiz(0)">◎ 自信あり</button>' +
           '<button class="act sub" onclick="finishQuiz(1)">△ なんとなく</button></div>' +
           '<div class="hint">「なんとなく」は正解でも復習に入ります</div>';
    } else h += '<button class="act" onclick="finishQuiz(0)">つぎへ</button>';
  }
  document.getElementById("qzRes").innerHTML = h;
}
function finishQuiz(weak) {
  /* A：「なんとなく」の正解は、まぐれ当たりかもしれないので × と同じ扱い（復習へ） */
  var ok = (QZ.ok && !weak) ? 1 : 0;
  var typed = (weak ? "[なんとなく] " : "") + (QZ.memo ? "[メモ:" + QZ.memo + "] " : "") + (QZ.typed || "");
  if (QZ.ctx === "m") grade(ok, typed);
  else if (QZ.ctx === "r") gradeRv(ok, typed);
  else if (QZ.ctx === "b") gradeB(ok, typed);
  else if (QZ.ctx === "d") gradeD(QZ.ok, weak, typed);
}

function emptyTrack() { return { day: 1, lastNight: "", pending: [], review: [], log: [], btest: null, tests: [], blockDone: [] }; }
function fixTrack(t) {
  if (!S[t]) S[t] = emptyTrack();
  var x = S[t];
  if (typeof x.day !== "number") x.day = 1;
  if (!x.pending) x.pending = [];
  if (!x.review) x.review = [];
  if (!x.log) x.log = [];
  if (!x.tests) x.tests = [];
  if (!x.blockDone) x.blockDone = [];
  if (x.btest === undefined) x.btest = null;
}
function loadState() {
  try { var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; }
  catch (e) { S = null; }
  if (!S) S = {};
  if (TRACKS.indexOf(S.track) < 0) S.track = "basic";
  for (var i = 0; i < TRACKS.length; i++) {
    fixTrack(TRACKS[i]);
  }
  /* 旧バージョン（トラック統合時代）の進み具合を引き継ぐ */
  try {
    var old = JSON.parse(localStorage.getItem("mainichi_anki_v1"));
    if (old && typeof old.day === "number" && !S._migrated) {
      S.adv.day = old.day; S.ai.day = old.day;
      S._migrated = 1;
    }
  } catch (e) {}
  T = S[S.track];
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 起動 ---------- */
fetch("cards.json").then(function (r) { return r.json(); }).then(function (d) {
  ALL = d;
  for (var i = 0; i < ALL.length; i++) {
    var c = ALL[i];

    '<div class="done"><div class="big">読み込めません</div>' +
    '<div class="small">cards.json が同じ場所にあるか確認してください。<br>GitHub Pages のURLで開いてください。</div></div>';
});

  document.getElementById("tabMorning").className = (MODE === "morning") ? "on" : "";
  document.getElementById("tabReview").className = (MODE === "review") ? "on" : "";
  document.getElementById("tabPast").className = (MODE === "past") ? "on" : "";

  else if (MODE === "tests") { renderTests(); }

  else if (MODE === "block") { renderBlock(); }
  else if (MODE === "morning") {

    for (var i = 0; i < T.pending.length; i++) { var c = byId(T.pending[i]); if (c) LIST.push(c); }

    renderReview();

/* ============ まとめテスト（4日ごと・ランダム出題） ============
   T.btest = { from, to, ids:[出題順], pos:何問目, ok:正解数, forced:受けるまで夜に進めないか }
   T.tests = [{ from, to, date, ok, total }]  … 受けた記録
   T.blockDone = [4, 8, ...]  … 済んだ強制テストの最終日          */
function blockIds(from, to) {
  var ids = [];
  for (var d = from; d <= to; d++) {
    var cs = cardsOfDay(d);
    for (var i = 0; i < cs.length; i++) ids.push(cs[i]._id);
  }
  return shuffle(ids);
}
function blockDueAfter(done) {
  /* 朝テストで終えた日の「1日前まで」の4日分を出す。
     例：5日目の朝テストが終わったら 1〜4日目、9日目なら 5〜8日目。
     今朝やったばかりの日は覚えたてなので入れない（次の回に入る） */
  var last = 0;
  for (var i = 0; i < done.length; i++) if (done[i].day > last) last = done[i].day;
  var to = last - 1;
  if (to < BLOCK || to % BLOCK !== 0) return null;
  if (T.blockDone.indexOf(to) >= 0) return null;
  if (T.btest && T.btest.forced) return T.btest;
  var from = to - BLOCK + 1, ids = blockIds(from, to);
  if (!ids.length) return null;
  T.btest = { from: from, to: to, ids: ids, pos: 0, ok: 0, forced: true, tf: makeTF(ids) };
  return T.btest;
}
function makeTF(ids) {
  /* B：選択問題のおよそ半分を○×に。出す選択肢は 4割が正解・6割が不正解 */
  var tf = {};
  for (var i = 0; i < ids.length; i++) {
    var c = byId(ids[i]);
    if (!c || c.type !== "choice" || !c.choices || Math.random() < 0.5) continue;
    if (Math.random() < 0.4) tf[c._id] = c.correct;
    else {
      var wrong = [];
      for (var k = 0; k < c.choices.length; k++) if (k !== c.correct) wrong.push(k);
      tf[c._id] = wrong[Math.floor(Math.random() * wrong.length)];
    }
  }
  return tf;
}
function startBlock(from, to) {
  if (T.btest && T.btest.forced) {
    alert(T.btest.from + "〜" + T.btest.to + "日目のまとめテストを先に終わらせてください。");
    setMode("block"); return;
  }
  var ids = blockIds(from, to);
  if (!ids.length) { alert("その範囲のカードがありません。"); return; }
  T.btest = { from: from, to: to, ids: ids, pos: 0, ok: 0, forced: false, tf: makeTF(ids) };
  saveState(); setMode("block");
}
function startCustom() {
  var a = parseInt(document.getElementById("rgFrom").value, 10);
  var b = parseInt(document.getElementById("rgTo").value, 10);
  var mx = Math.max(1, T.day - 1);
  if (isNaN(a) || isNaN(b) || a < 1 || b > mx || a > b) {
    alert("1〜" + mx + " の範囲で、はじめ ≦ おわり になるように入れてください。"); return;
  }
  startBlock(a, b);
}
function lastScore(from, to) {
  for (var i = T.tests.length - 1; i >= 0; i--) {
    var r = T.tests[i];
    if (r.from === from && r.to === to) return r.ok + " / " + r.total + "（" + r.date.slice(5) + "）";
  }
  return "まだ";
}

  app.innerHTML = h;
}
function renderBlock() {

  if (isQuiz(c)) { app.innerHTML = h + quizHtml(c, "b", tf); drawQuiz(); window.scrollTo(0, 0); return; }
  h += '<div class="q">' + esc(c.question) + '</div>';

/* ============ ダンジョン（覚えた問題でゲーム感覚の復習） ============
   B1〜B5 の5階。正解で敵にダメージ、不正解で自分がダメージ。
   B5 のボスは「復習」にたまっている苦手な問題から優先して出す。
   間違えた・自信がなかった問題は、その科目の「復習」に入る。        */
var DG = null;   /* 挑戦中のダンジョン（アプリを閉じると消える） */
var IMG_DIR = "";   /* 画像の置き場所（index.html と同じ場所なら空のまま） */
var MONSTERS = [];
for (var mi = 1; mi <= 18; mi++) MONSTERS.push("monster" + mi + ".png");
var FLOORS = [
  { n: "スライム",     e: "🟢", hp: 20, atk: 10, img: ["slime.png"] },
  { n: "さまよう魔物", e: "🦇", hp: 30, atk: 12, img: MONSTERS },
  { n: "ゴースト",     e: "👻", hp: 30, atk: 15, img: ["ghost.png"] },
  { n: "ガイコツ",     e: "💀", hp: 40, atk: 15, img: ["skull.png"] },
  { n: "魔王",         e: "🐉", hp: 60, atk: 20, img: ["boss.png"], boss: true }
];
function dgImgErr(el) {      /* 画像が置かれていないときは絵文字に切り替える */
  var sp = document.createElement("span"); sp.textContent = el.getAttribute("data-e");
  el.parentNode.replaceChild(sp, el);

/* ---- BGM・効果音（前のダンジョンと同じ。音楽ファイルは不要で、その場で音を作る） ---- */
var Sound = {
  ctx: null, timer: null,
  on: function () { return !(S && S.dungeon && S.dungeon.bgm === false); },
  init: function () {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  playBGM: function (type) {
    this.stopBGM();
    if (!this.on() || !this.init()) return;
    var melody, tempo;
    if (type === "field") { melody = [392, 392, 440, 523, 587, 523, 440, 392, 392, 330, 392, 523]; tempo = 200; }
    else if (type === "battle") { melody = [110, 110, 130, 110, 146, 110, 130, 110, 164, 110, 146, 110]; tempo = 100; }
    else if (type === "boss") { melody = [65, 73, 82, 73, 65, 73, 82, 97]; tempo = 120; }
    else return;
    var self = this, i = 0;
    var note = function () {
      var c = self.ctx, o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = (type === "field") ? "triangle" : "sawtooth";
      o.frequency.value = melody[i];
      g.gain.setValueAtTime(0.1, c.currentTime);
      g.gain.linearRampToValueAtTime(0, c.currentTime + (tempo / 1000) * 0.9);
      o.start(); o.stop(c.currentTime + tempo / 1000);
      i = (i + 1) % melody.length;
    };
    note(); this.timer = setInterval(note, tempo);
  },
  stopBGM: function () { if (this.timer) clearInterval(this.timer); this.timer = null; },
  se: function (type) {
    if (!this.on() || !this.init()) return;
    var c = this.ctx, now = c.currentTime;
    if (type === "win") {
      this.stopBGM();
      [523, 659, 783, 1046].forEach(function (f, k) {
        var o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination); o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.1, now + k * 0.1); g.gain.linearRampToValueAtTime(0, now + k * 0.1 + 0.3);
        o.start(now + k * 0.1); o.stop(now + k * 0.1 + 0.3);
      });
      return;
    }
    var o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    if (type === "decide") {
      o.frequency.setValueAtTime(880, now); g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.1); o.start(now); o.stop(now + 0.1);
    } else if (type === "damage") {
      o.type = "square"; o.frequency.setValueAtTime(150, now); o.frequency.linearRampToValueAtTime(50, now + 0.2);
      g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0.01, now + 0.2); o.start(now); o.stop(now + 0.2);
    }
  }
};
function dgToggleBGM() {
  var st = dgStats(); st.bgm = (st.bgm === false); saveState();
  if (!st.bgm) Sound.stopBGM();
  else Sound.playBGM(DG ? (FLOORS[DG.floor].boss ? "boss" : "battle") : "field");
  var b = document.getElementById("dgBgmBtn"); if (b) b.textContent = st.bgm === false ? "🔇 BGM OFF" : "🔊 BGM ON";
}
function dgBgmBtn() {
  return '<div class="dgtop"><button id="dgBgmBtn" class="dgbgm" onclick="dgToggleBGM()">' +
         (dgStats().bgm === false ? "🔇 BGM OFF" : "🔊 BGM ON") + '</button></div>';
}
var PLAYER_MAX = 100;
function dgTracks(scope) { return scope === "all" ? TRACKS.slice() : [S.track]; }
function dgLearned(scope) {
  /* 夜に覚え終えた日（day < その科目の今の日）だけを出す */
  var ts = dgTracks(scope);
  return ALL.filter(function (c) {
    return ts.indexOf(c.track) >= 0 && S[c.track] && c.day < S[c.track].day;
  });
}
function dgWeak(scope) {
  var ts = dgTracks(scope), out = [];
  for (var i = 0; i < ts.length; i++) {
    var rv = (S[ts[i]] && S[ts[i]].review) || [];
    for (var j = 0; j < rv.length; j++) { var c = byId(rv[j]); if (c && c.day < S[ts[i]].day) out.push(c); }
  }
  return out;
}
function dgStats() { if (!S.dungeon) S.dungeon = { best: 0, clears: 0, runs: 0 }; return S.dungeon; }
function renderDungeon() {
  if (DG) { dgShow(); return; }
  var st = dgStats(), cur = dgLearned("cur").length, all = dgLearned("all").length;
  Sound.playBGM("field");
  var h = '<div class="dgbox">' + dgBgmBtn() + '<div class="dgenemy">🏰</div>' +
    '<div class="dgname">記憶のダンジョン</div>' +
    '<div style="font-size:14px;line-height:1.8;text-align:center">覚えた問題が敵になって出てきます。<br>' +
    '正解で攻撃、まちがえるとダメージ。<br>地下5階のボスは、あなたの苦手な問題です。</div>' +
    '<div class="dgmsg" style="text-align:center">最高到達：' + (st.best ? 'B' + st.best : 'まだ') +
    '　クリア：' + st.clears + '回　挑戦：' + st.runs + '回</div></div>';
  h += '<div class="dgpick">';
  if (cur) h += '<button class="act" onclick="dgStart(\'cur\')">' + TRACK_NAME[S.track] + 'で挑む（' + cur + '問）</button>';
  else h += '<div class="note">' + TRACK_NAME[S.track] + 'は、まだ覚え終えた問題がありません。夜の「おぼえる」を進めると挑めるようになります。</div>';
  if (all > cur) h += '<button class="act sub" onclick="dgStart(\'all\')">全科目まぜて挑む（' + all + '問）</button>';
  h += '</div>';
  document.getElementById("app").innerHTML = h;
}
function dgStart(scope) {
  var pool = shuffle(dgLearned(scope));
  if (!pool.length) return;
  dgStats().runs++; saveState();
  DG = { scope: scope, floor: 0, php: PLAYER_MAX, ehp: FLOORS[0].hp, pool: pool, used: {},
         ok: 0, total: 0, msg: FLOORS[0].n + 'があらわれた！', anim: "", cleared: false, cur: null,
         imgs: FLOORS.map(function (f) { return f.img[Math.floor(Math.random() * f.img.length)]; }) };
  Sound.playBGM("battle");
  dgNext();
}
function dgPick() {
  var f = FLOORS[DG.floor], c = null, i;
  if (f.boss) {                         /* ボスは苦手な問題から */
    var weak = shuffle(dgWeak(DG.scope));
    for (i = 0; i < weak.length; i++) if (!DG.used[weak[i]._id]) { c = weak[i]; break; }
  }
  if (!c) for (i = 0; i < DG.pool.length; i++) if (!DG.used[DG.pool[i]._id]) { c = DG.pool[i]; break; }
  if (!c) { DG.used = {}; c = DG.pool[Math.floor(Math.random() * DG.pool.length)]; }   /* 一周したら最初から */
  DG.used[c._id] = 1;
  return c;
}
function dgNext() {
  var c = dgPick(), tf;
  if (c.type === "choice" && c.choices && Math.random() < 0.3) {     /* たまに○×で攻めてくる */
    if (Math.random() < 0.4) tf = c.correct;
    else { var w = []; for (var k = 0; k < c.choices.length; k++) if (k !== c.correct) w.push(k); tf = w[Math.floor(Math.random() * w.length)]; }
  }
  DG.cur = { c: c, tf: tf };
  dgShow();
}
function dgHeader() {
  var f = FLOORS[DG.floor];
  return '<div class="dgbox' + (DG.anim === "ouch" ? ' ouch' : '') + '">' + dgBgmBtn() +
    '<div class="dgfloor"><span>地下' + (DG.floor + 1) + '階' + (f.boss ? '（ボス）' : '') + '</span>' +
    '<span>正解 ' + DG.ok + ' / ' + DG.total + '</span></div>' +
    '<div class="dgenemy' + (DG.anim === "shake" ? ' shake' : '') + '">' +
      (DG.ehp > 0 ? '<img class="dgimg" src="' + IMG_DIR + DG.imgs[DG.floor] + '" data-e="' + f.e + '" onerror="dgImgErr(this)">' : '✨') + '</div>' +
    '<div class="dgname">' + f.n + '</div>' +
    '<div class="bar e"><div style="width:' + Math.max(0, DG.ehp * 100 / f.hp) + '%"></div></div>' +
    '<div class="dglabel">あなたのHP ' + Math.max(0, DG.php) + ' / ' + PLAYER_MAX + '</div>' +
    '<div class="bar p"><div style="width:' + Math.max(0, DG.php * 100 / PLAYER_MAX) + '%"></div></div>' +
    '<div class="dgmsg">' + DG.msg + '</div></div>';
}
function dgShow() {
  var app = document.getElementById("app"), c = DG.cur.c;
  var h = dgHeader() + '<div class="greet">' + TRACK_NAME[c.track] + '　' + c.day + '日目の問題' +
          (DG.cur.tf !== undefined ? '<span class="tag">○×</span>' : '') + '</div>';
  DG.anim = "";
  if (isQuiz(c)) { app.innerHTML = h + quizHtml(c, "d", DG.cur.tf); drawQuiz(); window.scrollTo(0, 0); return; }
  h += '<div class="q">' + esc(c.question) + '</div>';
  h += '<textarea id="dtyped" placeholder="思い出して書く"></textarea>';
  h += '<button class="act" id="dBtn" onclick="revealD()">こたえを見る</button>';
  h += '<div id="dans" class="hide"><div class="a" style="margin-top:22px">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp">' + esc(c.explanation) + '</div>';
  h += easyHtml(c);
  h += '<div class="two"><button class="act ng" onclick="gradeD(0,0)">× 言えなかった</button>';
  h += '<button class="act ok" onclick="gradeD(1,0)">○ 言えた</button></div></div>';
  app.innerHTML = h; window.scrollTo(0, 0);
}
function revealD() {
  document.getElementById("dans").className = "";
  document.getElementById("dBtn").className = "act hide";
}
function gradeD(ok, weak, typed) {
  var c = DG.cur.c, f = FLOORS[DG.floor], R = S[c.track];
  if (typed === undefined) { var el = document.getElementById("dtyped"); typed = el ? el.value : ""; }
  DG.total++;
  if (ok) {
    var dmg = weak ? 6 : 10, crit = !weak && Math.random() < 0.25;
    if (crit) dmg = 18;
    DG.ok++; DG.ehp -= dmg; DG.anim = "shake"; Sound.se("decide");
    DG.msg = (crit ? '会心の一撃！ ' : (weak ? 'かすった！ ' : '正解！ ')) + f.n + 'に ' + dmg + ' のダメージ！';
  } else {
    DG.php -= f.atk; DG.anim = "ouch"; Sound.se("damage");
    DG.msg = 'まちがえた… ' + f.n + 'の攻撃！ ' + f.atk + ' のダメージを受けた。';
  }
  if ((!ok || weak) && R && R.review.indexOf(c._id) < 0) R.review.push(c._id);   /* 苦手は復習へ */
  if (R) R.log.push({ id: c._id, day: studyDate(), ok: (ok && !weak) ? 1 : 0, dg: 1, typed: typed || "" });
  saveState();
  if (DG.php <= 0) { dgEnd(false); return; }
  if (DG.ehp <= 0) { dgFloorClear(); return; }
  dgNext();
}
function dgFloorClear() {
  var f = FLOORS[DG.floor], st = dgStats();
  if (DG.floor + 1 > st.best) { st.best = DG.floor + 1; saveState(); }
  Sound.se("win");
  if (f.boss) { dgEnd(true); return; }
  setTimeout(function () { if (DG) Sound.playBGM("field"); }, 1500);
  var heal = Math.min(20, PLAYER_MAX - DG.php);
  DG.php += heal;
  var nf = FLOORS[DG.floor + 1];
  document.getElementById("app").innerHTML =
    '<div class="dgbox"><div class="dgenemy">🪜</div><div class="dgname">' + f.n + 'をたおした！</div>' +
    '<div class="dgmsg" style="text-align:center">' + (heal ? '休んで HP が ' + heal + ' 回復した。<br>' : '') +
    '次は地下' + (DG.floor + 2) + '階' + (nf.boss ? '…ボスの気配がする。' : '。') + '</div></div>' +
    '<button class="act" onclick="dgDown()">階段を下りる</button>';
  window.scrollTo(0, 0);
}
function dgDown() {
  DG.floor++; DG.ehp = FLOORS[DG.floor].hp; DG.anim = "";
  Sound.playBGM(FLOORS[DG.floor].boss ? "boss" : "battle");
  DG.msg = FLOORS[DG.floor].n + 'があらわれた！' + (FLOORS[DG.floor].boss ? '（苦手な問題で攻めてくる！）' : '');
  dgNext();
}
function dgEnd(clear) {
  var st = dgStats(), ok = DG.ok, total = DG.total, fl = DG.floor + 1;
  if (clear) st.clears++; else { Sound.stopBGM(); Sound.se("damage"); }
  saveState();
  DG = null;
  document.getElementById("app").innerHTML =
    '<div class="dgbox"><div class="dgenemy">' + (clear ? '👑' : '🪦') + '</div>' +
    '<div class="dgname">' + (clear ? 'ダンジョン制覇！' : '地下' + fl + '階でたおれてしまった…') + '</div>' +
    '<div class="dgmsg" style="text-align:center">正解 ' + ok + ' / ' + total + ' 問<br>' +
    'まちがえた問題と「なんとなく」の問題は「復習」に入りました。</div></div>' +
    '<button class="act" onclick="setMode(\'dungeon\')">もう一度挑む</button>' +
    '<button class="act sub" onclick="setMode(\'review\')">復習へ行く</button>';
  document.getElementById("tabReview").textContent = "復習" + (T.review.length > 0 ? "（" + T.review.length + "）" : "");
  window.scrollTo(0, 0);
}

/* ============ 復習（間違えた問題だけ・○で消える） ============ */
function renderReview() {
  var app = document.getElementById("app");
  if (LIST.length === 0) {
    app.innerHTML = '<div class="done"><div class="big">復習はありません</div>' +
      '<div class="small">間違えた問題がここにたまります。<br>正解すると消えます。</div></div>';
    return;
  }
  showReviewCard();
}
function showReviewCard() {
  var app = document.getElementById("app");
  if (IDX >= LIST.length) {
    app.innerHTML = '<div class="done"><div class="big">ひととおり終わりました</div>' +
      '<div class="small">残り ' + T.review.length + ' 問です。</div></div>' +
      (T.review.length > 0 ? '<button class="act sub" onclick="setMode(\'review\')">もう一度やる</button>' : '');
    return;
  }
  var c = LIST[IDX];
  var h = '<div class="greet">復習 ' + (IDX + 1) + ' / ' + LIST.length + ' 問　（' + c.day + '日目）</div>';
  if (isQuiz(c)) {
    app.innerHTML = h + quizHtml(c, "r"); drawQuiz(); window.scrollTo(0, 0); return;
  }
  h += '<div class="q">' + esc(c.question) + '</div>';
  h += '<textarea id="rvtyped" placeholder="思い出して書く"></textarea>';
  h += '<button class="act" id="rvBtn" onclick="revealRv()">こたえを見る</button>';
  h += '<div id="rvans" class="hide">';
  h += '<div class="a" style="margin-top:22px">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp">' + esc(c.explanation) + '</div>';
  h += easyHtml(c);
  h += '<div class="two">';
  h += '<button class="act ng" onclick="gradeRv(0)">× まだダメ</button>';
  h += '<button class="act ok" onclick="gradeRv(1)">○ 言えた</button>';
  h += '</div></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function revealRv() {
  document.getElementById("rvans").className = "";
  document.getElementById("rvBtn").className = "act hide";
}
function gradeRv(ok, typed) {
  var c = LIST[IDX];
  if (typed === undefined) typed = document.getElementById("rvtyped").value;
  if (ok) removeFromReview(c._id);
  T.log.push({ id: c._id, day: studyDate(), ok: ok, rv: 1, typed: typed });
  saveState();
  document.getElementById("tabReview").textContent =
    "復習" + (T.review.length > 0 ? "（" + T.review.length + "）" : "");
  IDX++; showReviewCard();
}

/* ============ 過去問（答えと説明を別々に開ける） ============ */
function renderPast() {
  var app = document.getElementById("app");
  var h = '<div class="picker">';
  h += '<button onclick="movePast(-1)">◀</button>';
  h += '<div class="cur" onclick="jumpPast()">' + PAST_DAY + ' 日目</div>';
  h += '<button onclick="movePast(1)">▶</button>';
  h += '</div><div id="pv"></div>';
  h += '<div class="note">数字を押すと日付を直接えらべます。<br>過去問は進み具合に影響しません。</div>';
  app.innerHTML = h;
  IDX = 0; showPastCard();
}
function movePast(d) {
  var n = PAST_DAY + d;
  if (n < 1 || n > (MAXDAY[S.track] || 1)) return;
  PAST_DAY = n; render();
}
function jumpPast() {
  var mx = MAXDAY[S.track] || 1;
  var input = prompt("何日目を見ますか？（1〜" + mx + "）", PAST_DAY);
  if (input === null) return;
  var n = parseInt(input, 10);
  if (isNaN(n) || n < 1 || n > mx) { alert("1〜" + mx + " の数字を入れてください。"); return; }
  PAST_DAY = n; render();
}
function showPastCard() {
  var pv = document.getElementById("pv");
  if (!pv) return;
  if (LIST.length === 0) {
    pv.innerHTML = '<div class="done"><div class="small">この日のカードはありません。</div></div>';
    return;
  }
  if (IDX >= LIST.length) {
    pv.innerHTML = '<div class="done"><div class="big">この日はおわり</div>' +
      '<div class="small">◀ ▶ で別の日に移れます。</div></div>' +
      '<button class="act sub" onclick="IDX=0;showPastCard()">もう一度見る</button>';
    return;
  }
  var c = LIST[IDX];
  var inBox = (T.review.indexOf(c._id) >= 0);
  var h = '<div class="greet">' + (IDX + 1) + ' 枚目 / ' + LIST.length + ' 枚</div>';
  var quiz = isQuiz(c);
  if (quiz) {
    h += quizHtml(c, "p");
  } else {
    h += '<div class="q">' + esc(c.question) + '</div>';
    h += '<textarea id="ptyped" placeholder="思い出して書く"></textarea>';
    h += '<div class="two">';
    h += '<button class="act sub" id="pAnsBtn" onclick="showPart(\'pAns\')">こたえを見る</button>';
    h += '<button class="act sub" id="pExpBtn" onclick="showPart(\'pExp\')">説明を見る</button>';
    h += '</div>';
    h += '<div id="pAns" class="hide"><div class="a" style="margin-top:18px">' + esc(answerText(c)) + '</div></div>';
    h += '<div id="pExp" class="hide"><div class="exp" style="margin-top:14px">' + esc(c.explanation || "") + '</div>' + easyHtml(c) + '</div>';
  }
  h += '<button class="act sub" id="pBoxBtn" onclick="toggleBox(\'' + c._id + '\')">' +
       (inBox ? "復習からはずす" : "復習に入れる") + '</button>';
  h += '<button class="act" onclick="IDX++;showPastCard()">' +
       (IDX + 1 < LIST.length ? "つぎへ" : "おわり") + '</button>';
  pv.innerHTML = h;
  if (quiz) drawQuiz();
  window.scrollTo(0, 0);
}
function showPart(id) {
  document.getElementById(id).className = "";
  var b = document.getElementById(id + "Btn");
  if (b) b.className = "act sub hide";
}
function toggleBox(id) {
  var k = T.review.indexOf(id);
  if (k >= 0) T.review.splice(k, 1); else T.review.push(id);
  saveState();
  var b = document.getElementById("pBoxBtn");
  if (b) b.textContent = (k >= 0) ? "復習に入れる" : "復習からはずす";
  document.getElementById("tabReview").textContent =
    "復習" + (T.review.length > 0 ? "（" + T.review.length + "）" : "");
}

/* ============ 進み具合を直す（今のトラックだけ） ============ */
function fixDay() {
  var mx = MAXDAY[S.track] || 1;
  var input = prompt(TRACK_NAME[S.track] + " の次に覚える日を指定します（1〜" + mx + "）。\n" +
                     "今は " + T.day + " 日目の予定です。", T.day);
  if (input === null) return;
  var n = parseInt(input, 10);
  if (isNaN(n) || n < 1 || n > mx) { alert("1〜" + mx + " の数字を入れてください。"); return; }
  if (!confirm(n + " 日目から再開します。よろしいですか？\n（復習箱はそのまま残ります）")) return;
  T.day = n; T.lastNight = ""; T.pending = []; T.btest = null;
  PAST_DAY = Math.max(1, n - 1);
  saveState(); MODE = "night"; render();
}

/* ---------- バックアップ ---------- */
function backup() {
  var blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "anki_backup_" + studyDate() + ".json";
  a.click();
}
function restore() {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        S = JSON.parse(r.result);
        if (TRACKS.indexOf(S.track) < 0) S.track = "basic";
        for (var i = 0; i < TRACKS.length; i++) fixTrack(TRACKS[i]);
        T = S[S.track]; saveState();
        PAST_DAY = Math.max(1, T.day - 1);
        render(); alert("復元しました");
      } catch (e) { alert("読み込めませんでした"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
</script>
</body>
