<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F5F6F2">
<title>まいにち暗記</title>
<style>
  :root {
    --bg: #F5F6F2; --ink: #1F2A2E; --muted: #6B767C; --line: #DDE2DC;
    --blue: #2B5FA3; --green: #2E7D5B; --red: #C4453A;
    --basic: #2B5FA3; --adv: #2E7D5B; --ai: #B8741A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 18px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 480px; margin: 0 auto; padding: 18px 20px 40px; }

  /* どれを勉強するか */
  .tracks { display: flex; gap: 7px; margin-bottom: 14px; }
  .tracks button {
    flex: 1; padding: 11px 0; font-size: 14px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 11px;
    background: #fff; color: var(--muted); font-family: inherit; line-height: 1.3;
  }
  .tracks button.on { color: #fff; }
  .tracks button.on.basic { background: var(--basic); border-color: var(--basic); }
  .tracks button.on.adv   { background: var(--adv);   border-color: var(--adv); }
  .tracks button.on.ai    { background: var(--ai);    border-color: var(--ai); }

  .tabs { display: flex; gap: 8px; margin-bottom: 9px; }
  .tabs:last-of-type { margin-bottom: 18px; }
  .tabs button {
    flex: 1; padding: 12px 0; font-size: 15px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--muted); font-family: inherit;
  }
  .tabs button.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  .greet { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 18px; text-align: center; line-height: 1.8; }

  .q { font-size: 26px; font-weight: 700; line-height: 1.4; margin: 0 0 22px; }
  .a { font-size: 22px; font-weight: 700; color: var(--green); margin: 0 0 12px; }
  .exp {
    font-size: 16px; color: #3E4A4F; white-space: pre-line;
    border-left: 4px solid var(--line); padding-left: 14px; margin-bottom: 8px;
  }

  textarea {
    width: 100%; min-height: 84px; padding: 14px;
    font-size: 18px; font-family: inherit; line-height: 1.5;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--ink); resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--blue); }

  button.act {
    display: block; width: 100%; padding: 18px;
    font-size: 19px; font-weight: 700; font-family: inherit;
    color: #fff; background: var(--blue);
    border: 0; border-radius: 14px; margin-top: 14px; cursor: pointer;
  }
  button.act:active { opacity: .85; }
  .two { display: flex; gap: 12px; }
  .ok { background: var(--green); }
  .ng { background: var(--red); }
  .sub { background: #fff; color: var(--blue); border: 2px solid var(--line); }

  .picker { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .picker button {
    width: 52px; padding: 12px 0; font-size: 18px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--blue); font-family: inherit;
  }
  .picker .cur {
    flex: 1; text-align: center; font-size: 18px; font-weight: 700;
    padding: 12px 0; border: 2px solid var(--line); border-radius: 12px; background: #fff;
  }

  .done { text-align: center; padding: 42px 0 22px; }
  .done .big { font-size: 27px; font-weight: 700; margin-bottom: 10px; }
  .done .small { color: var(--muted); }

  .foot { margin-top: 36px; text-align: center; font-size: 14px; color: var(--muted); }
  .foot a { color: var(--muted); margin: 0 8px; white-space: nowrap; }
  .hide { display: none; }

  /* ===== 並べ替え・4択（Duolingo風） ===== */
  .q.long { font-size: 19px; line-height: 1.6; }
  .slot {
    display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
    min-height: 62px; padding: 8px 0; margin-bottom: 18px;
    border-bottom: 2px solid var(--line);
  }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 4px; }
  .tile {
    padding: 9px 14px; font-size: 18px; font-family: inherit; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px;
  }
  .tile.used { background: var(--line); color: transparent; border-color: var(--line); }
  .opt {
    display: block; width: 100%; text-align: left; padding: 15px 16px; margin-bottom: 10px;
    font-size: 17px; font-family: inherit; line-height: 1.4; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px;
  }
  .opt.right { border-color: var(--green); background: #E6F2EC; }
  .opt.wrong { border-color: var(--red); background: #F8E7E5; }
  .res { margin-top: 18px; padding: 14px 16px; border-radius: 12px; }
  .res.good { background: #E6F2EC; }
  .res.bad  { background: #F8E7E5; }
  .res .mark { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .res.good .mark { color: var(--green); }
  .res.bad  .mark { color: var(--red); }
  button.act:disabled { opacity: .4; }
</style>
</head>
<body>
<main>
  <div class="tracks">
    <button id="trBasic" class="basic" onclick="setTrack('basic')">英語<br>基礎</button>
    <button id="trAdv"   class="adv"   onclick="setTrack('adv')">英語<br>応用</button>
    <button id="trAi"    class="ai"    onclick="setTrack('ai')">AI<br>E資格</button>
  </div>
  <div class="tabs">
    <button id="tabNight" onclick="setMode('night')">夜：おぼえる</button>
    <button id="tabMorning" onclick="setMode('morning')">朝：テスト</button>
  </div>
  <div class="tabs">
    <button id="tabReview" onclick="setMode('review')">復習</button>
    <button id="tabPast" onclick="setMode('past')">過去問</button>
  </div>
  <div id="app"></div>
  <div class="foot">
    <a href="#" onclick="fixDay();return false;">進み具合を直す</a>
    <a href="#" onclick="backup();return false;">バックアップ</a>
    <a href="#" onclick="restore();return false;">復元</a>
  </div>
</main>

<script>
/* ==================================================
   cards.json … track（basic / adv / ai）ごとに day と枚数を持つ
   localStorage … 進みぐあい。トラックごとに完全に別管理
   ================================================== */
var KEY = "mainichi_anki_v2";
var TRACKS = ["basic", "adv", "ai"];
var TRACK_NAME = { basic: "英語（基礎）", adv: "英語（応用）", ai: "AI（E資格）" };

var ALL = [];
var S = null;          // { track: "basic", basic:{...}, adv:{...}, ai:{...} }
var T = null;          // 今選んでいるトラックの状態（Sの中の一部を指す）
var MODE = "night";
var LIST = [], IDX = 0;
var MAXDAY = {}, PAST_DAY = 1;
var JUST_LEARNED = [];

/* 午前4時を1日の区切りにする（深夜に開いてもズレない） */
function studyDate() {
  var d = new Date();
  if (d.getHours() < 4) d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function byId(id) {
  for (var i = 0; i < ALL.length; i++) if (ALL[i]._id === id) return ALL[i];
  return null;
}
function cardsOfDay(n) {
  return ALL.filter(function (c) { return c.track === S.track && c.day === n; });
}

/* ============ 並べ替え・4択（Duolingo風） ============
   type なし     … 今まで通り（書いて自己採点）
   type:"order"    … 日→英 並べ替え（answerを自動で単語に分ける）
   type:"order_ja" … 英→日 並べ替え（piecesで区切りを指定）
   type:"choice"   … 4択（choices と correct=正解の番号 0〜3）
   ========================================================= */
var QZ = null;
var PUNC = /[.,!?。、！？]/g;
function isQuiz(c) { return c.type === "order" || c.type === "order_ja" || c.type === "choice"; }
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function cleanWord(w) { return String(w || "").replace(PUNC, "").trim(); }
function joinSep(c) { return (c.type === "order_ja") ? "" : " "; }
function rightPieces(c) {
  var p = (c.pieces && c.pieces.length) ? c.pieces : String(c.answer || "").split(/\s+/);
  return p.map(cleanWord).filter(function (w) { return w; });
}
function norm(c, s) {
  s = String(s || "").toLowerCase().replace(PUNC, "");
  return (c.type === "order_ja") ? s.replace(/\s+/g, "") : s.replace(/\s+/g, " ").trim();
}
/* 答えの文字（answerが無いカードでも表示できるように） */
function answerText(c) {
  if (c.answer) return c.answer;
  if (c.type === "choice" && c.choices) return c.choices[c.correct] || "";
  if (c.pieces) return c.pieces.join(joinSep(c));
  return "";
}

function quizHtml(c, ctx) {
  QZ = { c: c, ctx: ctx, picked: [], done: false, chosen: -1 };
  if (c.type === "choice") {
    QZ.opts = shuffle((c.choices || []).map(function (t, i) { return { t: t, i: i }; }));
  } else {
    QZ.tiles = shuffle(rightPieces(c).concat((c.dummy || []).map(cleanWord)
                 .filter(function (w) { return w; })));
  }
  return '<div class="q' + (c.type === "choice" ? ' long' : '') + '">' + esc(c.question) + '</div>' +
         '<div id="qzBody"></div><div id="qzRes"></div>';
}
function drawQuiz() {
  var c = QZ.c, h = "", k;
  if (c.type === "choice") {
    for (k = 0; k < QZ.opts.length; k++) {
      var cls = "opt";
      if (QZ.done) {
        if (QZ.opts[k].i === c.correct) cls += " right";
        else if (k === QZ.chosen) cls += " wrong";
      }
      h += '<button class="' + cls + '" onclick="pickOpt(' + k + ')">' + esc(QZ.opts[k].t) + '</button>';
    }
  } else {
    h += '<div class="slot">';
    for (k = 0; k < QZ.picked.length; k++) {
      h += '<button class="tile" onclick="unpick(' + k + ')">' + esc(QZ.tiles[QZ.picked[k]]) + '</button>';
    }
    h += '</div><div class="bank">';
    for (k = 0; k < QZ.tiles.length; k++) {
      var used = QZ.picked.indexOf(k) >= 0;
      h += '<button class="tile' + (used ? ' used' : '') + '" onclick="pickTile(' + k + ')">' +
           esc(QZ.tiles[k]) + '</button>';
    }
    h += '</div>';
    if (!QZ.done) {
      h += '<button class="act" onclick="checkOrder()"' + (QZ.picked.length ? '' : ' disabled') +
           '>こたえ合わせ</button>';
    }
  }
  document.getElementById("qzBody").innerHTML = h;
}
function pickTile(k) {
  if (QZ.done || QZ.picked.indexOf(k) >= 0) return;
  QZ.picked.push(k); drawQuiz();
}
function unpick(k) {
  if (QZ.done) return;
  QZ.picked.splice(k, 1); drawQuiz();
}
function checkOrder() {
  var c = QZ.c;
  var typed = QZ.picked.map(function (k) { return QZ.tiles[k]; }).join(joinSep(c));
  var ok = (norm(c, typed) === norm(c, rightPieces(c).join(joinSep(c))));
  var alts = c.alts || [];
  for (var i = 0; i < alts.length && !ok; i++) if (norm(c, typed) === norm(c, alts[i])) ok = true;
  showResult(ok ? 1 : 0, typed);
}
function pickOpt(k) {
  if (QZ.done) return;
  QZ.chosen = k;
  showResult(QZ.opts[k].i === QZ.c.correct ? 1 : 0, QZ.opts[k].t);
}
function showResult(ok, typed) {
  var c = QZ.c;
  QZ.done = true; QZ.ok = ok; QZ.typed = typed;
  drawQuiz();
  var h = '<div class="res ' + (ok ? 'good' : 'bad') + '">';
  h += '<div class="mark">' + (ok ? '○ 正解！' : '× ざんねん') + '</div>';
  if (!ok || c.type !== "choice") h += '<div class="a" style="margin:0 0 6px">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp" style="margin:0">' + esc(c.explanation) + '</div>';
  h += '</div>';
  if (QZ.ctx !== "p") h += '<button class="act" onclick="finishQuiz()">つぎへ</button>';
  document.getElementById("qzRes").innerHTML = h;
}
function finishQuiz() {
  if (QZ.ctx === "m") grade(QZ.ok, QZ.typed);
  else if (QZ.ctx === "r") gradeRv(QZ.ok, QZ.typed);
}

function emptyTrack() { return { day: 1, lastNight: "", pending: [], review: [], log: [] }; }
function loadState() {
  try { var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; }
  catch (e) { S = null; }
  if (!S) S = {};
  if (TRACKS.indexOf(S.track) < 0) S.track = "basic";
  for (var i = 0; i < TRACKS.length; i++) {
    var t = TRACKS[i];
    if (!S[t]) S[t] = emptyTrack();
    if (typeof S[t].day !== "number") S[t].day = 1;
    if (!S[t].pending) S[t].pending = [];
    if (!S[t].review) S[t].review = [];
    if (!S[t].log) S[t].log = [];
  }
  /* 旧バージョン（トラック統合時代）の進み具合を引き継ぐ */
  try {
    var old = JSON.parse(localStorage.getItem("mainichi_anki_v1"));
    if (old && typeof old.day === "number" && !S._migrated) {
      S.adv.day = old.day; S.ai.day = old.day;
      S._migrated = 1;
    }
  } catch (e) {}
  T = S[S.track];
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 起動 ---------- */
fetch("cards.json").then(function (r) { return r.json(); }).then(function (d) {
  ALL = d;
  for (var i = 0; i < ALL.length; i++) {
    var c = ALL[i];
    if (!c.track) c.track = (c.kind === "esk") ? "ai" : "adv";
    c._id = c.track + "-" + c.day + "-" + i;
    if (!MAXDAY[c.track] || c.day > MAXDAY[c.track]) MAXDAY[c.track] = c.day;
  }
  loadState();
  PAST_DAY = Math.max(1, T.day - 1);
  MODE = (T.pending.length > 0) ? "morning" : "night";
  render();
}).catch(function () {
  document.getElementById("app").innerHTML =
    '<div class="done"><div class="big">読み込めません</div>' +
    '<div class="small">cards.json が同じ場所にあるか確認してください。<br>GitHub Pages のURLで開いてください。</div></div>';
});

function setTrack(t) {
  S.track = t; T = S[t]; saveState();
  PAST_DAY = Math.max(1, T.day - 1);
  MODE = (T.pending.length > 0) ? "morning" : "night";
  render();
}
function setMode(m) { MODE = m; IDX = 0; render(); }

function render() {
  IDX = 0;
  document.getElementById("trBasic").className = "basic" + (S.track === "basic" ? " on" : "");
  document.getElementById("trAdv").className   = "adv"   + (S.track === "adv"   ? " on" : "");
  document.getElementById("trAi").className    = "ai"    + (S.track === "ai"    ? " on" : "");
  document.getElementById("tabNight").className = (MODE === "night") ? "on" : "";
  document.getElementById("tabMorning").className = (MODE === "morning") ? "on" : "";
  document.getElementById("tabReview").className = (MODE === "review") ? "on" : "";
  document.getElementById("tabPast").className = (MODE === "past") ? "on" : "";
  document.getElementById("tabReview").textContent =
    "復習" + (T.review.length > 0 ? "（" + T.review.length + "）" : "");

  if (MODE === "night") { LIST = cardsOfDay(T.day); renderNight(); }
  else if (MODE === "morning") {
    LIST = [];
    for (var i = 0; i < T.pending.length; i++) { var c = byId(T.pending[i]); if (c) LIST.push(c); }
    renderMorning();
  }
  else if (MODE === "review") {
    LIST = [];
    for (var j = 0; j < T.review.length; j++) { var r = byId(T.review[j]); if (r) LIST.push(r); }
    renderReview();
  }
  else { LIST = cardsOfDay(PAST_DAY); renderPast(); }
}

/* ============ 夜：おぼえる（1日1回・終えると翌日へ） ============ */
function renderNight() {
  var app = document.getElementById("app");
  if (T.lastNight === studyDate()) {
    app.innerHTML = '<div class="done"><div class="big">今夜はおわり</div>' +
      '<div class="small">' + TRACK_NAME[S.track] + ' の今日の分は終わりました。<br>' +
      '次は明日の夜、' + T.day + '日目です。</div></div>' +
      '<div class="note">ほかの科目は上のボタンで切り替えられます。<br>' +
      '前の日を見たいときは「過去問」をどうぞ。</div>';
    return;
  }
  if (LIST.length === 0) {
    app.innerHTML = '<div class="done"><div class="big">カードがありません</div>' +
      '<div class="small">' + TRACK_NAME[S.track] + ' の' + T.day + '日目が入っていません。</div></div>';
    return;
  }
  showNightCard();
}
function showNightCard() {
  var app = document.getElementById("app");
  if (IDX >= LIST.length) {
    T.pending = [];
    for (var i = 0; i < LIST.length; i++) T.pending.push(LIST[i]._id);
    T.lastNight = studyDate();
    T.day = T.day + 1;
    saveState();
    JUST_LEARNED = LIST.slice();
    app.innerHTML = '<div class="done"><div class="big">おぼえた！</div>' +
      '<div class="small">明日の朝、この' + LIST.length + '枚が出ます。</div></div>' +
      '<button class="act sub" onclick="testNow()">今すぐテストする</button>';
    return;
  }
  var c = LIST[IDX];
  var h = '<div class="greet">' + TRACK_NAME[S.track] + '　' + c.day + '日目　' +
          (IDX + 1) + ' / ' + LIST.length + ' 枚</div>';
  h += '<div class="q' + (c.type === "choice" ? ' long' : '') + '">' + esc(c.question) + '</div>';
  h += '<div class="a">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp">' + esc(c.explanation) + '</div>';
  h += '<button class="act" onclick="IDX++;showNightCard()">' +
       (IDX + 1 < LIST.length ? "つぎへ" : "おぼえた") + '</button>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function testNow() { if (JUST_LEARNED.length) { MODE = "morning"; render(); } }

/* ============ 朝：テスト（前夜の分だけ・×は復習箱へ） ============ */
function renderMorning() {
  var app = document.getElementById("app");
  if (LIST.length === 0) {
    app.innerHTML = '<div class="done"><div class="big">今の出題はありません</div>' +
      '<div class="small">「夜：おぼえる」でカードを覚えると、<br>ここに出てきます。</div></div>';
    return;
  }
  showQuestion();
}
function showQuestion() {
  var app = document.getElementById("app");
  if (IDX >= LIST.length) {
    T.pending = []; saveState();
    var msg = (T.review.length > 0)
      ? '間違えた問題は「復習」にたまっています。<br>今は ' + T.review.length + ' 問です。'
      : '全問正解です。';
    app.innerHTML = '<div class="done"><div class="big">おつかれさま！</div>' +
      '<div class="small">' + msg + '</div></div>';
    return;
  }
  var c = LIST[IDX];
  var h = '<div class="greet">' + (IDX + 1) + ' 問目 / ' + LIST.length + ' 問　（' + c.day + '日目）</div>';
  if (isQuiz(c)) {
    app.innerHTML = h + quizHtml(c, "m"); drawQuiz(); window.scrollTo(0, 0); return;
  }
  h += '<div class="q">' + esc(c.question) + '</div>';
  h += '<textarea id="typed" placeholder="思い出して書く"></textarea>';
  h += '<button class="act" id="revealBtn" onclick="reveal()">こたえを見る</button>';
  h += '<div id="ans" class="hide">';
  h += '<div class="a" style="margin-top:22px">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp">' + esc(c.explanation) + '</div>';
  h += '<div class="two">';
  h += '<button class="act ng" onclick="grade(0)">× 言えなかった</button>';
  h += '<button class="act ok" onclick="grade(1)">○ 言えた</button>';
  h += '</div></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function reveal() {
  document.getElementById("ans").className = "";
  document.getElementById("revealBtn").className = "act hide";
}
function grade(ok, typed) {
  var c = LIST[IDX];
  if (typed === undefined) typed = document.getElementById("typed").value;
  if (ok) removeFromReview(c._id);
  else if (T.review.indexOf(c._id) < 0) T.review.push(c._id);
  T.log.push({ id: c._id, day: studyDate(), ok: ok, typed: typed });
  saveState(); IDX++; showQuestion();
}
function removeFromReview(id) {
  var k = T.review.indexOf(id);
  if (k >= 0) T.review.splice(k, 1);
}

/* ============ 復習（間違えた問題だけ・○で消える） ============ */
function renderReview() {
  var app = document.getElementById("app");
  if (LIST.length === 0) {
    app.innerHTML = '<div class="done"><div class="big">復習はありません</div>' +
      '<div class="small">間違えた問題がここにたまります。<br>正解すると消えます。</div></div>';
    return;
  }
  showReviewCard();
}
function showReviewCard() {
  var app = document.getElementById("app");
  if (IDX >= LIST.length) {
    app.innerHTML = '<div class="done"><div class="big">ひととおり終わりました</div>' +
      '<div class="small">残り ' + T.review.length + ' 問です。</div></div>' +
      (T.review.length > 0 ? '<button class="act sub" onclick="setMode(\'review\')">もう一度やる</button>' : '');
    return;
  }
  var c = LIST[IDX];
  var h = '<div class="greet">復習 ' + (IDX + 1) + ' / ' + LIST.length + ' 問　（' + c.day + '日目）</div>';
  if (isQuiz(c)) {
    app.innerHTML = h + quizHtml(c, "r"); drawQuiz(); window.scrollTo(0, 0); return;
  }
  h += '<div class="q">' + esc(c.question) + '</div>';
  h += '<textarea id="rvtyped" placeholder="思い出して書く"></textarea>';
  h += '<button class="act" id="rvBtn" onclick="revealRv()">こたえを見る</button>';
  h += '<div id="rvans" class="hide">';
  h += '<div class="a" style="margin-top:22px">' + esc(answerText(c)) + '</div>';
  if (c.explanation) h += '<div class="exp">' + esc(c.explanation) + '</div>';
  h += '<div class="two">';
  h += '<button class="act ng" onclick="gradeRv(0)">× まだダメ</button>';
  h += '<button class="act ok" onclick="gradeRv(1)">○ 言えた</button>';
  h += '</div></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function revealRv() {
  document.getElementById("rvans").className = "";
  document.getElementById("rvBtn").className = "act hide";
}
function gradeRv(ok, typed) {
  var c = LIST[IDX];
  if (typed === undefined) typed = document.getElementById("rvtyped").value;
  if (ok) removeFromReview(c._id);
  T.log.push({ id: c._id, day: studyDate(), ok: ok, rv: 1, typed: typed });
  saveState();
  document.getElementById("tabReview").textContent =
    "復習" + (T.review.length > 0 ? "（" + T.review.length + "）" : "");
  IDX++; showReviewCard();
}

/* ============ 過去問（答えと説明を別々に開ける） ============ */
function renderPast() {
  var app = document.getElementById("app");
  var h = '<div class="picker">';
  h += '<button onclick="movePast(-1)">◀</button>';
  h += '<div class="cur" onclick="jumpPast()">' + PAST_DAY + ' 日目</div>';
  h += '<button onclick="movePast(1)">▶</button>';
  h += '</div><div id="pv"></div>';
  h += '<div class="note">数字を押すと日付を直接えらべます。<br>過去問は進み具合に影響しません。</div>';
  app.innerHTML = h;
  IDX = 0; showPastCard();
}
function movePast(d) {
  var n = PAST_DAY + d;
  if (n < 1 || n > (MAXDAY[S.track] || 1)) return;
  PAST_DAY = n; render();
}
function jumpPast() {
  var mx = MAXDAY[S.track] || 1;
  var input = prompt("何日目を見ますか？（1〜" + mx + "）", PAST_DAY);
  if (input === null) return;
  var n = parseInt(input, 10);
  if (isNaN(n) || n < 1 || n > mx) { alert("1〜" + mx + " の数字を入れてください。"); return; }
  PAST_DAY = n; render();
}
function showPastCard() {
  var pv = document.getElementById("pv");
  if (!pv) return;
  if (LIST.length === 0) {
    pv.innerHTML = '<div class="done"><div class="small">この日のカードはありません。</div></div>';
    return;
  }
  if (IDX >= LIST.length) {
    pv.innerHTML = '<div class="done"><div class="big">この日はおわり</div>' +
      '<div class="small">◀ ▶ で別の日に移れます。</div></div>' +
      '<button class="act sub" onclick="IDX=0;showPastCard()">もう一度見る</button>';
    return;
  }
  var c = LIST[IDX];
  var inBox = (T.review.indexOf(c._id) >= 0);
  var h = '<div class="greet">' + (IDX + 1) + ' 枚目 / ' + LIST.length + ' 枚</div>';
  var quiz = isQuiz(c);
  if (quiz) {
    h += quizHtml(c, "p");
  } else {
    h += '<div class="q">' + esc(c.question) + '</div>';
    h += '<textarea id="ptyped" placeholder="思い出して書く"></textarea>';
    h += '<div class="two">';
    h += '<button class="act sub" id="pAnsBtn" onclick="showPart(\'pAns\')">こたえを見る</button>';
    h += '<button class="act sub" id="pExpBtn" onclick="showPart(\'pExp\')">説明を見る</button>';
    h += '</div>';
    h += '<div id="pAns" class="hide"><div class="a" style="margin-top:18px">' + esc(answerText(c)) + '</div></div>';
    h += '<div id="pExp" class="hide"><div class="exp" style="margin-top:14px">' + esc(c.explanation || "") + '</div></div>';
  }
  h += '<button class="act sub" id="pBoxBtn" onclick="toggleBox(\'' + c._id + '\')">' +
       (inBox ? "復習からはずす" : "復習に入れる") + '</button>';
  h += '<button class="act" onclick="IDX++;showPastCard()">' +
       (IDX + 1 < LIST.length ? "つぎへ" : "おわり") + '</button>';
  pv.innerHTML = h;
  if (quiz) drawQuiz();
  window.scrollTo(0, 0);
}
function showPart(id) {
  document.getElementById(id).className = "";
  var b = document.getElementById(id + "Btn");
  if (b) b.className = "act sub hide";
}
function toggleBox(id) {
  var k = T.review.indexOf(id);
  if (k >= 0) T.review.splice(k, 1); else T.review.push(id);
  saveState();
  var b = document.getElementById("pBoxBtn");
  if (b) b.textContent = (k >= 0) ? "復習に入れる" : "復習からはずす";
  document.getElementById("tabReview").textContent =
    "復習" + (T.review.length > 0 ? "（" + T.review.length + "）" : "");
}

/* ============ 進み具合を直す（今のトラックだけ） ============ */
function fixDay() {
  var mx = MAXDAY[S.track] || 1;
  var input = prompt(TRACK_NAME[S.track] + " の次に覚える日を指定します（1〜" + mx + "）。\n" +
                     "今は " + T.day + " 日目の予定です。", T.day);
  if (input === null) return;
  var n = parseInt(input, 10);
  if (isNaN(n) || n < 1 || n > mx) { alert("1〜" + mx + " の数字を入れてください。"); return; }
  if (!confirm(n + " 日目から再開します。よろしいですか？\n（復習箱はそのまま残ります）")) return;
  T.day = n; T.lastNight = ""; T.pending = [];
  PAST_DAY = Math.max(1, n - 1);
  saveState(); MODE = "night"; render();
}

/* ---------- バックアップ ---------- */
function backup() {
  var blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "anki_backup_" + studyDate() + ".json";
  a.click();
}
function restore() {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        S = JSON.parse(r.result);
        if (TRACKS.indexOf(S.track) < 0) S.track = "basic";
        for (var i = 0; i < TRACKS.length; i++) {
          if (!S[TRACKS[i]]) S[TRACKS[i]] = emptyTrack();
        }
        T = S[S.track]; saveState();
        PAST_DAY = Math.max(1, T.day - 1);
        render(); alert("復元しました");
      } catch (e) { alert("読み込めませんでした"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
</script>
</body>
</html>
